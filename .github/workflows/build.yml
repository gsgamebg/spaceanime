name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package no longer exists in the SDK repository.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Windows and Android
        shell: pwsh
        run: ./gradlew.bat :composeApp:desktopTest :composeApp:desktopJar :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: anim-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
